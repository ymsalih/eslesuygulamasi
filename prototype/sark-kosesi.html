<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Şark Köşesi: Prototip</title>
<style>
  :root {
    --bg: #f6efe4;
    --ink: #3b2a1e;
    --muted: #8a7462;
    --card: #fffaf2;
    --line: #e6d7c3;
    --accent: #b5452f;
    --accent-ink: #fff;
    --gold: #c9973f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  header .logo { font-weight: 800; font-size: 20px; letter-spacing: -.3px; }
  header .logo span { color: var(--accent); }
  header .city {
    margin-left: auto; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
    font: inherit; font-size: 14px; background: #fff; color: var(--ink); cursor: pointer;
  }
  header .online { font-size: 13px; color: var(--muted); }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff;
    color: var(--ink); padding: 8px 14px; border-radius: 10px;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.primary:hover { filter: brightness(1.05); }
  .proto-note {
    font-size: 12px; color: var(--muted); padding: 6px 20px; background: #f1e6d4; border-bottom: 1px solid var(--line);
  }

  /* ---------- Lobi ---------- */
  #lobby { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .lobby-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .lobby-top h1 { font-size: 22px; margin: 0; }
  .lobby-top .spacer { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .room-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    cursor: pointer; transition: transform .12s, box-shadow .12s;
  }
  .room-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(80,50,20,.10); }
  .room-card .cat { font-size: 12px; color: var(--muted); }
  .room-card .topic { font-weight: 700; margin: 6px 0 10px; line-height: 1.3; min-height: 2.6em; }
  .room-card .seats { display: flex; gap: 4px; flex-wrap: wrap; }
  .room-card .seat { width: 16px; height: 12px; border-radius: 4px; background: #eadbc6; }
  .room-card .seat.full { background: var(--accent); }
  .room-card .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .room-card.full-room { opacity: .6; }

  /* ---------- Oda ---------- */
  #room { display: none; max-width: 1280px; margin: 0 auto; padding: 16px; gap: 16px; }
  #room.active { display: flex; }
  .scene-wrap { flex: 1.6; min-width: 0; }
  .room-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .room-head h2 { font-size: 18px; margin: 0; }
  .room-head .tag { font-size: 12px; color: var(--muted); }
  .room-head .spacer { flex: 1; }
  .scene {
    position: relative; width: 100%; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(80,50,20,.12); user-select: none;
  }
  .scene svg { display: block; width: 100%; height: auto; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .nametag {
    position: absolute; transform: translate(-50%, 0); white-space: nowrap;
    font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    background: rgba(255,250,242,.92); border: 1px solid rgba(0,0,0,.08); pointer-events: auto; cursor: pointer;
    max-width: 130px; overflow: hidden; text-overflow: ellipsis; z-index: 1;
  }
  .nametag.me { background: var(--accent); color: #fff; }
  .bubble {
    position: absolute; transform: translate(-50%, -100%); width: max-content; max-width: 200px; min-width: 40px; z-index: 2;
    background: #fff; color: var(--ink); font-size: 13px; line-height: 1.3; padding: 7px 10px;
    border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.15); animation: pop .18s ease-out;
    word-wrap: break-word;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  .bubble.typing { color: var(--muted); letter-spacing: 2px; font-weight: 700; }
  .bubble.fade { opacity: 0; transition: opacity .6s; }
  .bubble.left { transform: translate(-18%, -100%); }
  .bubble.left::after { left: 18%; }
  .bubble.right { transform: translate(-82%, -100%); }
  .bubble.right::after { left: 82%; }
  @keyframes pop { from { scale: .85; opacity: 0; } to { scale: 1; opacity: 1; } }
  .empty-seat {
    position: absolute; transform: translate(-50%, -50%); width: 64px; height: 40px; border-radius: 10px;
    pointer-events: auto; cursor: pointer;
  }
  .empty-seat:hover::after {
    content: "Buraya otur"; position: absolute; left: 50%; top: -22px; transform: translateX(-50%);
    font-size: 11px; white-space: nowrap; background: rgba(59,42,30,.85); color: #fff; padding: 2px 6px; border-radius: 6px;
  }
  .tea-fly { position: absolute; font-size: 22px; transform: translate(-50%, -50%); transition: left .9s ease-in-out, top .9s ease-in-out; }
  .menu {
    position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px;
    box-shadow: 0 8px 20px rgba(0,0,0,.15); pointer-events: auto; z-index: 5; transform: translate(-50%, 8px);
  }
  .menu button { display: block; width: 100%; text-align: left; border: 0; padding: 7px 10px; font-size: 13px; }
  .menu button:hover { background: #f6efe4; }

  .chat {
    flex: 1; min-width: 300px; display: flex; flex-direction: column; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px; overflow: hidden; max-height: calc(100vh - 140px);
  }
  .chat-head { padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700; display: flex; justify-content: space-between; }
  .chat-head span { font-weight: 400; color: var(--muted); font-size: 13px; }
  .log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 260px; }
  .msg { font-size: 14px; line-height: 1.4; }
  .msg b { margin-right: 6px; }
  .msg.sys { font-size: 12px; color: var(--muted); font-style: italic; }
  .msg.warn { font-size: 12px; color: #a23b22; background: #fbe9e3; padding: 6px 8px; border-radius: 8px; }
  .composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  .composer input {
    flex: 1; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff;
  }
  .composer input:focus { outline: 2px solid #e8b9a9; border-color: var(--accent); }
  .me-line { font-size: 12px; color: var(--muted); padding: 0 12px 10px; }

  @media (max-width: 900px) {
    #room.active { flex-direction: column; padding: 10px; }
    .chat { max-height: none; }
    .log { max-height: 40vh; }
    .bubble { font-size: 11px; max-width: 130px; padding: 5px 8px; }
    .nametag { font-size: 8px; padding: 1px 4px; max-width: 58px; }
    .chat { min-width: 0; }
    .composer input { min-width: 0; }
    .empty-seat { width: 40px; height: 26px; }
  }
</style>
</head>

/* Basit filtre (sunucudaki filtrenin küçük bir örneği) */
const BLOCKED = ["salak", "aptal", "gerizekalı", "mal"];
function normalize(s) {
  return s.toLocaleLowerCase("tr").replace(/[ıİ]/g, "i").replace(/ş/g, "s").replace(/ğ/g, "g")
    .replace(/ç/g, "c").replace(/ö/g, "o").replace(/ü/g, "u")
    .replace(/1/g, "i").replace(/0/g, "o").replace(/3/g, "e").replace(/4/g, "a").replace(/\$/g, "s")
    .replace(/(.)\1{2,}/g, "$1");
}
function checkMessage(text) {
  const words = normalize(text).split(/[^a-z]+/).filter(Boolean);
  if (words.some(w => BLOCKED.some(b => w === normalize(b) || w.startsWith(normalize(b) + "l")))) return "Mesajın topluluk kurallarına uymadığı için gönderilmedi.";
  if (/(\+?90|0)?\s*5\d{2}[\s-]?\d{3}[\s-]?\d{2}[\s-]?\d{2}/.test(text)) return "Telefon numarası paylaşmak güvenliğin için engellenir.";
  if (/(https?:\/\/|www\.|\.com\b|\.net\b|instagram|insta:)/i.test(text)) return "Link ve sosyal medya hesabı paylaşımı engellenir.";
  return null;
}

function renderLobby() {
  const grid = $("roomGrid");
  grid.innerHTML = "";
  ROOMS.forEach(r => {
    const card = document.createElement("div");
    card.className = "room-card" + (r.n >= CAPACITY ? " full-room" : "");
    const seats = Array.from({ length: CAPACITY }, (_, i) => `<div class="seat ${i < r.n ? "full" : ""}"></div>`).join("");
    card.innerHTML = `
      <div class="cat">${r.cat}</div>
      <div class="topic">${escapeHtml(r.topic)}</div>
      <div class="seats">${seats}</div>
      <div class="meta"><span>${r.n}/${CAPACITY} kişi</span><span>${r.n >= CAPACITY ? "Dolu" : "Otur →"}</span></div>`;
    card.onclick = () => r.n < CAPACITY ? enterRoom(r) : alert("Bu köşe dolu. Aynı konuda yeni bir köşe açılacak (prototipte devre dışı).");
    grid.appendChild(card);
  });
}

function randomRoom(excludeId) {
  // Boş yeri olan ve içinde en az 2 kişi bulunan köşeleri tercih et
  let pool = ROOMS.filter(r => r.n < CAPACITY && r.n >= 2 && r.id !== excludeId);
  if (!pool.length) pool = ROOMS.filter(r => r.n < CAPACITY && r.id !== excludeId);
  return pool[Math.floor(Math.random() * pool.length)];
}

function renderPeople() {
  document.getElementById("people").innerHTML = people.map(avatarSvg).join("");

  ov.querySelectorAll(".nametag, .empty-seat").forEach(e => e.remove());
  const taken = new Set(people.map(p => p.seat));
  SEATS.forEach((s, i) => {
    if (taken.has(i)) return;
    const e = document.createElement("div");
    e.className = "empty-seat";
    e.style.left = pct(s.x, W); e.style.top = pct(s.y + 22, H);
    e.onclick = () => moveMe(i);
    ov.appendChild(e);
  });
  people.forEach(p => {
    const s = SEATS[p.seat];
    const t = document.createElement("div");
    t.className = "nametag" + (p.me ? " me" : "");
    t.textContent = p.me ? p.name + " (sen)" : p.name;
    t.style.left = pct(s.x, W); t.style.top = pct(s.y + s.tag, H);
    t.style.borderColor = p.color;
    if (!p.me) t.onclick = ev => { ev.stopPropagation(); openMenu(p); };
    ov.appendChild(t);
  });
  $("seatCount").textContent = `${people.length}/${CAPACITY} kişi`;

/* ================= Konuşma balonları ================= */
const bubbles = {};
function showBubble(p, text, typing = false) {
  const ov = $("overlay");
  if (bubbles[p.id]) { bubbles[p.id].remove(); clearTimeout(bubbles[p.id]._t); }
  const s = SEATS[p.seat];
  const b = document.createElement("div");
  b.className = "bubble" + (typing ? " typing" : "") + (s.x < 200 ? " left" : s.x > 600 ? " right" : "");
  b.textContent = typing ? "•••" : text;
  b.style.left = pct(s.x, W); b.style.top = pct(s.y - 44, H);
  ov.appendChild(b);
  bubbles[p.id] = b;
  if (!typing) {
    b._t = setTimeout(() => { b.classList.add("fade"); setTimeout(() => b.remove(), 600); }, 4500);
  }
}
function clearBubble(p) { if (bubbles[p.id]) { bubbles[p.id].remove(); delete bubbles[p.id]; } }

/* ================= Sohbet günlüğü ================= */
function log(html, cls = "msg") {
  const d = document.createElement("div");
  d.className = cls;
  d.innerHTML = html;
  const l = $("log");
  l.appendChild(d);
  l.scrollTop = l.scrollHeight;
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function say(p, text) {
  showBubble(p, text);
  log(`<b style="color:${p.color}">${escapeHtml(p.name)}${p.me ? " (sen)" : ""}</b>${escapeHtml(text)}`);
}

/* ================= Kişiler ================= */
function freeSeats() { const t = new Set(people.map(p => p.seat)); return SEATS.map((_, i) => i).filter(i => !t.has(i)); }
function usedNames() { return new Set(people.map(p => p.name)); }
function newPerson(isMe = false) {
  const seats = freeSeats();
  if (!seats.length) return null;
  const names = NAMES.filter(n => !usedNames().has(n));
  const used = new Set(people.map(p => p.color));
  const color = COLORS.find(c => !used.has(c)) || COLORS[0];
  return {
    id: idSeq++, name: names[Math.floor(Math.random() * names.length)], color,
    skin: SKIN[Math.floor(Math.random() * SKIN.length)],
    seat: seats[Math.floor(Math.random() * seats.length)], me: isMe,
  };
}
function moveMe(seat) {
  closeMenu();
  clearBubble(me);
  me.seat = seat;
  renderPeople();
  log(`${escapeHtml(me.name)} yer değiştirdi.`, "msg sys");
}

/* ================= Menü: çay ikram et / gizle / bildir ================= */
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function openMenu(p) {
  closeMenu();
  const s = SEATS[p.seat];
  menuEl = document.createElement("div");
  menuEl.className = "menu";
  menuEl.style.left = pct(s.x, W); menuEl.style.top = pct(s.y + 50, H);
  menuEl.innerHTML = `<button data-a="tea">☕ Çay ikram et</button><button data-a="hide">🙈 Bu kişiyi gizle</button><button data-a="report">🚩 Bildir</button>`;
  menuEl.onclick = ev => {
    const a = ev.target.dataset.a;
    if (a === "tea") offerTea(p);
    if (a === "hide") log(`${escapeHtml(p.name)} senin ekranında gizlendi (prototip).`, "msg sys");
    if (a === "report") log(`${escapeHtml(p.name)} bildirildi. Teşekkürler, moderatörler inceleyecek.`, "msg sys");
    closeMenu();
  };
  $("overlay").appendChild(menuEl);
}
function offerTea(to, from = me) {
  const a = SEATS[from.seat], b = SEATS[to.seat];
  const t = document.createElement("div");
  t.className = "tea-fly"; t.textContent = "🍵";
  t.style.left = pct(a.x, W); t.style.top = pct(a.y - 20, H);
  $("overlay").appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => { t.style.left = pct(b.x, W); t.style.top = pct(b.y - 20, H); }));
  setTimeout(() => t.remove(), 1100);
  log(`☕ ${escapeHtml(from.name)}, ${escapeHtml(to.name)} için çay koydu.`, "msg sys");
  if (from.me) setTimeout(() => say(to, ["Eyvallah, sağ ol! ☕", "Çaylar bizden olsun bir dahakine 😄", "Ellerine sağlık"][Math.floor(Math.random() * 3)]), 1500);
}

/* ================= Odaya giriş / çıkış ================= */
function enterRoom(r) {
  room = r;
  people = []; idSeq = 1;
  Object.keys(bubbles).forEach(k => bubbles[k].remove());
  $("overlay").innerHTML = "";
  $("log").innerHTML = "";
  drawScene();
  const others = Math.min(r.n, CAPACITY - 1);
  for (let i = 0; i < others; i++) people.push(newPerson());
  me = newPerson(true);
  people.push(me);
  $("lobby").style.display = "none";
  $("room").classList.add("active");
  $("roomTopic").textContent = r.topic;
  $("roomMeta").textContent = `${r.cat} · ${CITY.name} · sinide ${CITY.trayName} · 24 saat sonra kapanır`;
  $("meLine").textContent = `Bu köşede adın: ${me.name}. Bir kişinin adına dokunup ona çay ikram edebilirsin.`;
  renderPeople();
  log(`"${escapeHtml(r.topic)}" köşesine oturdun. Konu dışına çıkmamaya ve kurallara uymaya özen göster 🙂`, "msg sys");
  startBots();
  $("input").focus();
}
function leaveRoom() {
  stopBots();
  closeMenu();
  room.n = Math.max(0, people.length - 1);
  $("room").classList.remove("active");
  $("lobby").style.display = "";
  renderLobby();
}

/* ================= Simüle edilen diğer kullanıcılar ================= */
function startBots() {
  stopBots();
  const tick = () => {
    const bots = people.filter(p => !p.me);
    const r = Math.random();
    if (r < 0.08 && freeSeats().length) {
      const p = newPerson();
      people.push(p); renderPeople();
      log(`${escapeHtml(p.name)} köşeye oturdu.`, "msg sys");
    } else if (r < 0.13 && bots.length > 2) {
      const p = bots[Math.floor(Math.random() * bots.length)];
      clearBubble(p);
      people = people.filter(x => x !== p); renderPeople();
      log(`${escapeHtml(p.name)} köşeden kalktı.`, "msg sys");
    } else if (r < 0.18 && bots.length > 1) {
      const a = bots[Math.floor(Math.random() * bots.length)];
      const others = people.filter(x => x !== a);
      offerTea(others[Math.floor(Math.random() * others.length)], a);
    } else if (bots.length) {
      const p = bots[Math.floor(Math.random() * bots.length)];
      showBubble(p, "", true);
      setTimeout(() => {
        if (!people.includes(p)) return;
        const lines = room.lines || GENERIC_ROOMS[0].lines;
        say(p, lines[Math.floor(Math.random() * lines.length)]);
      }, 1200 + Math.random() * 800);
    }
    botTimer = setTimeout(tick, 2600 + Math.random() * 2600);
  };
  botTimer = setTimeout(tick, 1200);
}
function stopBots() { clearTimeout(botTimer); }

/* ================= Mesaj gönderme ================= */
function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text) return;
  const err = checkMessage(text);
  if (err) { log("⚠️ " + escapeHtml(err), "msg warn"); return; }
  say(me, text);
  input.value = "";
}

/* ================= Olaylar ================= */
$("sendBtn").onclick = send;
$("input").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("backBtn").onclick = leaveRoom;
$("randomBtn").onclick = () => enterRoom(randomRoom());
$("randomInRoomBtn").onclick = () => { const cur = room.id; leaveRoom(); enterRoom(randomRoom(cur)); };
$("reportRoomBtn").onclick = () => log("Bu köşe bildirildi. Son 40 mesaj incelenmek üzere kaydedilecek (prototip).", "msg sys");
$("newRoomBtn").onclick = () => {
  const topic = prompt("Köşenin konusu ne olsun? (10–100 karakter)");
  if (!topic) return;
  const t = topic.trim();
  if (t.length < 10 || t.length > 100) return alert("Konu 10–100 karakter olmalı.");
  const err = checkMessage(t);
  if (err) return alert(err);
  const r = { id: roomSeq++, cat: "💬 Muhabbet", topic: t, n: 0, lines: GENERIC_ROOMS[0].lines };
  ROOMS.unshift(r);
  enterRoom(r);
};
document.addEventListener("click", e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });

$("citySelect").onchange = e => {
  if ($("room").classList.contains("active")) leaveRoom();
  setCity(e.target.value);
  renderLobby();
};
setCity("izmir");
renderLobby();
</script>
